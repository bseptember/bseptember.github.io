<!DOCTYPE html>
<html>
<head>
  <title>OAuth Device Callback</title>
</head>
<body>
  <script>
    // Extract parameters from the URL query string
    const urlParams = new URLSearchParams(window.location.search);
    const deviceCode = urlParams.get('device_code');
    const userCode = urlParams.get('user_code');

    // Redirect to your server-side callback URL with the parameters
    const serverUrl = 'http://192.168.8.162:7000/ehs';
    const redirectUrl = `${serverUrl}?device_code=${deviceCode}&user_code=${userCode}`;
    window.location.href = redirectUrl;
  </script>
</body>
</html>
